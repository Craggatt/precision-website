version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm
        - pnpm install --frozen-lockfile
    build:
      commands:
        - env | grep -e PAYLOAD_SECRET -e DATABASE_URI -e S3_BUCKET -e S3_REGION -e S3_ACCESS_KEY_ID -e S3_SECRET_ACCESS_KEY >> .env.production
        - pnpm run build
      artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - $(pnpm store path)
      - .next/cache/**/*
